<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1" name="viewport"/>
    <title>niramaya.com Verification</title>
    <link rel="icon" type="image/png" href="N-16.png">
    <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css">
    <script src="theme.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        :root, :root.dark {
            --verify-bg: #18181b;
            --verify-card-bg: #222227;
            --verify-card-border: #33333d;
            --verify-title: #ffffff;
            --verify-text: #d1d5db;
            --verify-muted: #9ca3af;
            --verify-box-bg: #27272e;
            --verify-box-border: #4b5563;
            --verify-box-hover: #32323c;
            --verify-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
            --verify-accent: #3b82f6;
            --verify-toggle-bg: #27272e;
            --verify-toggle-text: #facc15;
            --verify-toggle-border: #3f3f46;
        }

        :root.light {
            --verify-bg: #f8fafc;
            --verify-card-bg: #ffffff;
            --verify-card-border: #e2e8f0;
            --verify-title: #0f172a;
            --verify-text: #334155;
            --verify-muted: #64748b;
            --verify-box-bg: #f1f5f9;
            --verify-box-border: #cbd5e1;
            --verify-box-hover: #e2e8f0;
            --verify-shadow: 0 12px 32px rgba(15, 23, 42, 0.08);
            --verify-accent: #2563eb;
            --verify-toggle-bg: #ffffff;
            --verify-toggle-text: #334155;
            --verify-toggle-border: #cbd5e1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', Arial, Helvetica, sans-serif;
            background-color: var(--verify-bg);
            color: var(--verify-text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem 1.25rem;
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        .top-bar {
            position: fixed;
            top: 20px;
            right: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .back-home-link {
            color: var(--verify-muted);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            padding: 8px 14px;
            border-radius: 8px;
            border: 1px solid var(--verify-toggle-border);
            background: var(--verify-toggle-bg);
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .back-home-link:hover {
            color: var(--verify-title);
            background: var(--verify-box-hover);
        }

        #theme-toggle {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            border: 1px solid var(--verify-toggle-border);
            background-color: var(--verify-toggle-bg);
            color: var(--verify-toggle-text);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            transition: background-color 0.2s ease, transform 0.15s ease;
        }

        #theme-toggle:hover {
            background-color: var(--verify-box-hover);
            transform: scale(1.04);
        }

        .container {
            width: 100%;
            max-width: 580px;
            background-color: var(--verify-card-bg);
            border: 1px solid var(--verify-card-border);
            border-radius: 16px;
            padding: 3rem 2.5rem;
            box-shadow: var(--verify-shadow);
            transition: background-color 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
        }

        .brand-row {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 1rem;
        }

        .brand-row img {
            height: 48px;
            width: auto;
        }

        .title {
            color: var(--verify-title);
            font-weight: 700;
            font-size: clamp(28px, 5vw, 40px);
            letter-spacing: -0.02em;
        }

        .description {
            color: var(--verify-text);
            margin-bottom: 1.75rem;
            font-size: 18px;
            line-height: 1.5;
        }

        .checkbox-container {
            display: inline-flex;
            align-items: center;
            background-color: var(--verify-box-bg);
            border: 1.5px solid var(--verify-box-border);
            border-radius: 10px;
            min-width: 240px;
            min-height: 58px;
            margin-bottom: 1.75rem;
            padding: 0.85rem 1.25rem;
            cursor: pointer;
            transition: background-color 0.2s ease, border-color 0.2s ease;
        }

        .checkbox-container:hover {
            background-color: var(--verify-box-hover);
            border-color: var(--verify-accent);
        }

        .checkbox {
            width: 1.35rem;
            height: 1.35rem;
            accent-color: var(--verify-accent);
            cursor: pointer;
        }

        .checkbox-label {
            margin-left: 0.85rem;
            color: var(--verify-title);
            font-size: 1rem;
            font-weight: 500;
            user-select: none;
            cursor: pointer;
        }

        .footer-text {
            color: var(--verify-muted);
            font-size: 14px;
            line-height: 1.6;
            padding-top: 1.25rem;
            border-top: 1px solid var(--verify-card-border);
        }

        .footer-text .site-name {
            color: var(--verify-title);
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <a href="home.html" class="back-home-link"><i class="fas fa-arrow-left"></i> Home</a>
        <button id="theme-toggle" aria-label="Toggle theme" title="Toggle Dark/Light Mode">
            <i class="fas fa-sun"></i>
        </button>
    </div>

    <div class="container">
        <div class="brand-row">
            <img id="logo-img" src="N-dark.png" alt="Niramaya Logo">
            <h1 class="title">niramaya.com</h1>
        </div>
        <p class="description">
            Verifying you are human. This may take a few seconds.
        </p>
        <label class="checkbox-container" for="human-checkbox">
            <input aria-label="I'm not a robot checkbox" class="checkbox" type="checkbox" onchange="redirectToQuestionInput()" id="human-checkbox"/>
            <span class="checkbox-label" id="msg">
                I'm not a robot
            </span>
        </label>
        <p class="footer-text">
            <span class="site-name">niramaya.com</span> needs to review the security of your connection before proceeding.
        </p>
    </div>

    <script>
        function redirectToQuestionInput() {
            const checkbox = document.getElementById('human-checkbox');
            const msg = document.getElementById('msg');
            if (!checkbox.checked) {
                alert('Please confirm you are not a robot.');
                return;
            }
            msg.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Verifying...';
            setTimeout(() => {
                window.location.replace('question_input.html');
            }, 350);
        }
    </script>
</body>
</html>
